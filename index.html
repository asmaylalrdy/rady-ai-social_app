<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rady Social AI | رضي إي آي</title>
    <!-- Pi SDK Integration -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-color: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }
        header p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.ai {
            background-color: var(--chat-bg);
            align-self: flex-start;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .message.user {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-end;
        }
        .input-area {
            background: white;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #e5e7eb;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 25px;
            outline: none;
            font-size: 0.95rem;
        }
        button.send-btn, button.pi-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        button.send-btn {
            background-color: var(--primary-color);
            color: white;
        }
        button.pi-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 0.8rem;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rady Social AI | رضي إي آي</h1>
        <p>منصتك الذكية للاستشارات والأعمال وتطوير الذات</p>
    </header>

    <div id="chat-container">
        <div class="message ai">
            مرحباً بك في Rady Social AI 🌍<br>
            اختر نوع المساعدة:<br>
            1️⃣ أعمال ومشاريع<br>
            2️⃣ تطوير الذات<br>
            3️⃣ تقنية وتطبيقات<br>
            4️⃣ العملات الرقمية<br>
            5️⃣ ترجمة عربي ↔ إنجليزي<br>
            6️⃣ الإعدادات ⚙️<br>
            7️⃣ حول ℹ️<br>
            <b>اكتب رقم القسم لنبدأ أو أرسل استفسارك مباشرة!</b>
        </div>
    </div>

    <div class="input-area">
        <button class="pi-btn" onclick="payWithPi()">🌟 تفعيل (Pi)</button>
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // التهيئة لشبكة باي
        window.addEventListener('DOMContentLoaded', (event) => {
            try {
                Pi.init({ version: "2.0", sandbox: true });
            } catch (e) {
                console.log("Pi SDK Init Error:", e);
            }
        });

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            // محاكاة الرد الفوري الذكي للأقسام
            setTimeout(() => {
                let reply = getSmartReply(text);
                appendMessage(reply, 'ai');
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function getSmartReply(query) {
            if (query === '1' || query.includes('أعمال')) {
                return "💼 **قسم الأعمال والمشاريع:**\n- دراسات جدوى متكاملة واستراتيجيات التسويق الرقمي.\n- تطوير نموذج العمل التجاري (Business Model Canvas).\nاكتب فكرة مشروعك لنبدأ العمل عليها!";
            } else if (query === '2' || query.includes('تطوير')) {
                return "🧠 **قسم تطوير الذات:**\n- العقلية النامية وتحديد الأهداف بذكاء (SMART).\n- إدارة الوقت وتقنية بومودورو.\nخصص 10 دقائق صباحاً لكتابة أهم 3 مهام يومك.";
            } else if (query === '3' || query.includes('تقنية')) {
                return "🛠️ **قسم تقنية وتطبيقات:**\n- أحدث أدوات الذكاء الاصطناعي وتطوير الويب.\n- بناء التطبيقات المتوافقة مع Pi Network وPWA.";
            } else if (query === '4' || query.includes('عملات') || query.includes('Pi')) {
                return "🪙 **قسم العملات الرقمية و Pi Network:**\n- متابعة اقتصاد Pi والتقنيات اللامركزية.\n- استراتيجيات التداول وتحليل السوق الرقمي.";
            } else if (query === '5' || query.includes('ترجمة')) {
                return "🔤 **قسم الترجمة:**\nأرسل النص الذي تريد ترجمته فوراً (عربي ↔ إنجليزي) وسأقدم لك ترجمة احترافية ودقيقة.";
            } else if (query === '6' || query.includes('إعدادات')) {
                return "⚙️ **قسم الإعدادات:**\nالمنصة تعمل بكفاءة عالية، جميع الأقسام مفعلة، وتدعم المعاملات الرقمية.";
            } else if (query === '7' || query.includes('حول')) {
                return "ℹ️ **حول المنصة:**\nRady Social AI هي منصة ذكية تدمج الذكاء الاصطناعي لخدمة المطورين والمجتمع الرقمي العربي بكل احترافية.";
            } else {
                return `أهلاً بك يا رفيقي! لقد استستلمت رسالتك: "${query}". أنا جاهز لدعمك باحترافية عالية في كافة المجالات، أختر أحد الأقسام من 1 إلى 7 لنبدأ فوراً! 🚀`;
            }
        }

        // دالة معاملة الدفع لاجتياز الخطوة 10 في بوابة المطورين
        function payWithPi() {
            const paymentData = {
                amount: 1,
                memo: "تفعيل الميزات الشاملة - Rady Social AI",
                metadata: { appId: "rady-social-ai" },
            };

            const callbacks = {
                onReadyForServerApproval: (paymentId) => {
                    appendMessage("⚡ جاري معالجة الدفع عبر شبكة Pi...", "ai");
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    appendMessage("✅ تم اعتماد الدفع بنجاح! تم فتح كافة الميزات الاحترافية لك.", "ai");
                },
                onCancel: (paymentId) => {
                    appendMessage("⚠️ تم إلغاء عملية الدفع.", "ai");
                },
                onError: (error, payment) => {
                    appendMessage("❌ حدث خطأ في الدفع، تأكد من استخدام متصفح Pi Browser.", "ai");
                }
            };

            if (window.Pi) {
                Pi.createPayment(paymentData, callbacks);
            } else {
                alert("يرجى فتح التطبيق حصرياً من داخل Pi Browser لإتمام المعاملة واجتياز الخطوة العاشرة.");
            }
        }
    </script>
</body>
</html>
